services:
  frontend:
    build: ./Frontend
    container_name: sun_frontend
    ports:
      - "18081:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    container_name: sun_backend
    ports:
      - "19000:9000"
    env_file:
      - ./Backend/.env.docker
    volumes:
      - ./Backend:/app
    command: >
      sh -lc '
        if [ -z "$$EXTERNAL_API_TOKEN" ]; then
          export EXTERNAL_API_TOKEN="$(grep -m1 "^EXTERNAL_API_TOKEN=" /app/.env.docker | cut -d= -f2- | tr -d "\r")";
        fi;
        uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload
      '
    depends_on:
      - model
      - redis
      - postgres

  model:
    image: sun-model:latest
    container_name: sun_model
    ports:
      - "18080:8080"
    volumes:
      - ./Model:/models
    command: >
      --server
      -m /models/qwen2-7b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      -c 4096

  redis:
    image: sun-redis:latest
    container_name: sun_redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: sun-postgres:latest
    container_name: sun_postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: sun_mes
      POSTGRES_USER: sun_user
      POSTGRES_PASSWORD: sun_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sun_user -d sun_mes"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
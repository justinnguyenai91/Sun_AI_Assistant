services:
  frontend:
    image: dthausdockerhub/aichatbox:sun-frontend
    container_name: sun_frontend
    ports:
      - "18081:80"
    depends_on:
      - backend

  backend:
    image: dthausdockerhub/aichatbox:sun-backend
    container_name: sun_backend
    ports:
      - "19000:9000"
    environment:
      # Required MES API settings
      - EXTERNAL_API_BASE_URL=${EXTERNAL_API_BASE_URL:-http://58.84.1.104:9082}
      - EXTERNAL_API_PREFIX=${EXTERNAL_API_PREFIX:-/api/rest/v1}
      - EXTERNAL_API_TOKEN=${EXTERNAL_API_TOKEN:-dev-key-123}
      - EXTERNAL_API_TIMEOUT=120
      - MES_FACTORY_BASE_URLS=${MES_FACTORY_BASE_URLS:-}
      # LLM settings
      - BACKEND=llama
      - LLAMA_URL=http://model:8080
      # Redis settings
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      # Database settings
      - DATABASE_URL=postgresql://sun_user:sun_pass_2026@postgres:5432/sun_mes
      - DATABASE_ENABLED=true
      # API settings
      - API_KEYS=dev-key-123,internal-abc
      - RATE_LIMIT=300
      - ALLOW_ORIGINS=*
      - LOCAL_TZ_OFFSET_HOURS=7
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000
    depends_on:
      - model
      - redis
      - postgres

  model:
    image: dthausdockerhub/aichatbox:sun-model
    container_name: sun_model
    ports:
      - "18080:8080"
    volumes:
      - ./Model:/models
    command: >
      --server
      -m /models/qwen2-7b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      -c 4096

  redis:
    image: dthausdockerhub/aichatbox:sun-redis
    container_name: sun_redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: dthausdockerhub/aichatbox:sun-postgres
    container_name: sun_postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: sun_mes
      POSTGRES_USER: sun_user
      POSTGRES_PASSWORD: sun_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sun_user -d sun_mes"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
# Metric definitions are used for derived KPI computation.
# Keep formulas here so planner can compute flexibly without hardcoding.
metrics:
  # -----------------------------
  # Base metrics (directly from APIs)
  # -----------------------------
  plan_qty:
    canonical: plan_qty
    synonyms:
      - kế hoạch
      - ke hoach
      - sản lượng kế hoạch
      - sl kế hoạch
      - plan
      - planned
      - plan qty
      - planned qty
      - planned quantity
    unit: pcs
    entity: production
    missing_as_zero: true

  actual_production_qty:
    canonical: actual_production_qty
    synonyms:
      - sản lượng thực tế
      - san luong thuc te
      - sản lượng sản xuất thực tế
      - san luong san xuat thuc te
      - sản lượng sx thực tế
      - san luong sx thuc te
      - sl thực tế
      - sl thuc te
      - actual qty
      - actual quantity
      - actual output
      - sản lượng actual
    unit: pcs
    entity: production
    missing_as_zero: true

  defect_count:
    canonical: defect_count
    synonyms:
      - số lỗi
      - số lượng lỗi
      - ng
      - hàng lỗi
      - hang loi
      - reject
      - reject qty
      - reject quantity
      - scrap
      - scrap qty
      - defect count
      - number of defects
      - quantity of defects
    unit: pcs
    entity: defect
    missing_as_zero: true

  good_qty:
    canonical: good_qty
    synonyms:
      - hàng ok
      - hang ok
      - số lượng ok
      - so luong ok
      - good qty
      - good quantity
      - ok quantity
    unit: pcs
    entity: production
    precision: 0
    formula: "actual_production_qty - defect_count"
    depends_on:
      - actual_production_qty
      - defect_count

  yield_rate:
    canonical: yield_rate
    synonyms:
      - yield
      - yield rate
      - good rate
      - tỷ lệ đạt chất lượng
      - ty le dat chat luong
      - tỷ lệ ok
      - ty le ok
      - quality rate
    unit: percent
    entity: production
    precision: 2
    formula: "(good_qty / actual_production_qty) * 100"
    depends_on:
      - good_qty
      - actual_production_qty

  # -----------------------------
  # Computed KPIs (derived via formula)
  # NOTE: formulas live here so KPI logic is config-driven (no hardcoding).
  # -----------------------------
  variance_qty:
    canonical: variance_qty
    synonyms:
      - chênh lệch
      - chenhlech
      - variance
      - plan variance
      - actual minus plan
    unit: pcs
    entity: production
    precision: 0
    formula: "actual_production_qty - plan_qty"
    depends_on:
      - actual_production_qty
      - plan_qty

  plan_attainment_percent:
    canonical: plan_attainment_percent
    synonyms:
      - tỷ lệ đạt kế hoạch
      - ty le dat ke hoach
      - đạt kế hoạch
      - dat ke hoach
      - plan attainment
      - plan attainment %
      - plan attainment percent
      - plan achievement
      - achievement rate
      - completion rate
    unit: percent
    entity: production
    precision: 2
    formula: "(actual_production_qty / plan_qty) * 100"
    depends_on:
      - actual_production_qty
      - plan_qty

  defect_percent:
    canonical: defect_percent
    synonyms:
      - defect %
      - defect percent
      - defect rate
      - defect rate %
      - tỷ lệ lỗi
      - ty le loi
      - "% lỗi"
      - "% loi"
      - defect percentage
    unit: percent
    entity: defect
    precision: 2
    formula: "(defect_count / actual_production_qty) * 100"
    depends_on:
      - defect_count
      - actual_production_qty

  defect_ppm:
    canonical: defect_ppm
    synonyms:
      - defect ppm
      - ppm
      - ppm lỗi
      - ppm defect
    unit: ppm
    entity: defect
    precision: 2
    # defect ppm = defect_count / actual_production_qty * 1,000,000
    formula: "(defect_count / actual_production_qty) * 1000000"
    depends_on:
      - defect_count
      - actual_production_qty
  # -----------------------------
  # Productivity & Efficiency Metrics
  # -----------------------------
  productivity_per_hour:
    canonical: productivity_per_hour
    synonyms:
      - năng suất giờ
      - nang suat gio
      - productivity per hour
      - output per hour
      - hourly productivity
    unit: pcs/hour
    entity: production
    precision: 2
    formula: "actual_production_qty / working_hours"
    depends_on:
      - actual_production_qty
      - working_hours
  
  efficiency_rate:
    canonical: efficiency_rate
    synonyms:
      - hiệu suất
      - hieu suat
      - efficiency
      - efficiency rate
      - operational efficiency
    unit: percent
    entity: production
    precision: 2
    formula: "(actual_production_qty / plan_qty) * 100"
    depends_on:
      - actual_production_qty
      - plan_qty
  
  # -----------------------------
  # OEE (Overall Equipment Effectiveness)
  # -----------------------------
  availability_rate:
    canonical: availability_rate
    synonyms:
      - tỷ lệ khả dụng
      - ty le kha dung
      - availability
      - availability rate
      - uptime rate
    unit: percent
    entity: production
    precision: 2
    missing_as_zero: false
  
  performance_rate:
    canonical: performance_rate
    synonyms:
      - tỷ lệ hiệu suất
      - performance
      - performance rate
    unit: percent
    entity: production
    precision: 2
    formula: "(actual_production_qty / plan_qty) * 100"
    depends_on:
      - actual_production_qty
      - plan_qty
  
  quality_rate:
    canonical: quality_rate
    synonyms:
      - tỷ lệ chất lượng
      - ty le chat luong
      - quality rate
      - quality
    unit: percent
    entity: production
    precision: 2
    formula: "((actual_production_qty - defect_count) / actual_production_qty) * 100"
    depends_on:
      - actual_production_qty
      - defect_count
  
  oee:
    canonical: oee
    synonyms:
      - oee
      - overall equipment effectiveness
      - hiệu suất tổng thể
      - hieu suat tong the
    unit: percent
    entity: production
    precision: 2
    formula: "(performance_rate * quality_rate) / 100"
    depends_on:
      - performance_rate
      - quality_rate

  # -----------------------------
  # Downtime & Loss Metrics
  # -----------------------------
  downtime_hours:
    canonical: downtime_hours
    synonyms:
      - thời gian dừng
      - thoi gian dung
      - downtime
      - downtime hours
      - machine downtime
      - line downtime
    unit: hours
    entity: production
    precision: 2
    missing_as_zero: true
  
  total_loss_qty:
    canonical: total_loss_qty
    synonyms:
      - tổng lượng mất
      - tong luong mat
      - total loss
      - loss quantity
      - waste quantity
    unit: pcs
    entity: production
    precision: 0
    formula: "defect_count + scrap_qty"
    depends_on:
      - defect_count
      - scrap_qty
  
  scrap_qty:
    canonical: scrap_qty
    synonyms:
      - hàng phế
      - hang phe
      - scrap
      - scrap quantity
      - waste
    unit: pcs
    entity: defect
    precision: 0
    missing_as_zero: true

  # -----------------------------
  # Cycle Time & Takt Time
  # -----------------------------
  avg_cycle_time:
    canonical: avg_cycle_time
    synonyms:
      - thời gian chu kỳ
      - cycle time
      - average cycle time
      - avg cycle time
    unit: seconds
    entity: production
    precision: 2
    missing_as_zero: false
  
  takt_time:
    canonical: takt_time
    synonyms:
      - thời gian takt
      - takt time
      - tact time
      - average takt time
    unit: seconds
    entity: production
    precision: 2
    missing_as_zero: false
# Metric definitions are used for derived KPI computation.
# Keep formulas here so planner can compute flexibly without hardcoding.
metrics:
  # -----------------------------
  # Base metrics (directly from APIs)
  # -----------------------------
  plan_qty:
    canonical: plan_qty
    synonyms:
      - kế hoạch
      - ke hoach
      - sản lượng kế hoạch
      - sl kế hoạch
      - plan
      - planned
      - plan qty
      - planned qty
      - planned quantity
    unit: pcs
    entity: production
    missing_as_zero: true

  actual_production_qty:
    canonical: actual_production_qty
    synonyms:
      - sản lượng thực tế
      - sản lượng sản xuất thực tế
      - sản lượng sx thực tế
      - sl thực tế
      - actual qty
      - actual quantity
      - actual output
      - sản lượng actual
    unit: pcs
    entity: production
    missing_as_zero: true

  defect_count:
    canonical: defect_count
    synonyms:
      - số lỗi
      - số lượng lỗi
      - defect count
      - number of defects
      - quantity of defects
    unit: pcs
    entity: defect
    missing_as_zero: true

  # -----------------------------
  # Computed KPIs (derived via formula)
  # NOTE: formulas live here so KPI logic is config-driven (no hardcoding).
  # -----------------------------
  variance_qty:
    canonical: variance_qty
    synonyms:
      - chênh lệch
      - chenhlech
      - variance
      - plan variance
      - actual minus plan
    unit: pcs
    entity: production
    precision: 0
    formula: "actual_production_qty - plan_qty"
    depends_on:
      - actual_production_qty
      - plan_qty

  plan_attainment_percent:
    canonical: plan_attainment_percent
    synonyms:
      - tỷ lệ đạt kế hoạch
      - ty le dat ke hoach
      - đạt kế hoạch
      - dat ke hoach
      - plan attainment
      - plan attainment %
      - plan attainment percent
      - plan achievement
      - achievement rate
      - completion rate
    unit: percent
    entity: production
    precision: 2
    formula: "(actual_production_qty / plan_qty) * 100"
    depends_on:
      - actual_production_qty
      - plan_qty

  defect_percent:
    canonical: defect_percent
    synonyms:
      - defect %
      - defect percent
      - defect rate
      - defect rate %
      - tỷ lệ lỗi
      - ty le loi
      - "% lỗi"
      - "% loi"
      - defect percentage
    unit: percent
    entity: defect
    precision: 2
    formula: "(defect_count / actual_production_qty) * 100"
    depends_on:
      - defect_count
      - actual_production_qty

  defect_ppm:
    canonical: defect_ppm
    synonyms:
      - defect ppm
      - ppm
      - ppm lỗi
      - ppm defect
    unit: ppm
    entity: defect
    precision: 2
    # defect ppm = defect_count / actual_production_qty * 1,000,000
    formula: "(defect_count / actual_production_qty) * 1000000"
    depends_on:
      - defect_count
      - actual_production_qty
